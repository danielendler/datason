name: Agents Snapshot Compatibility

on:
  pull_request:
    paths:
      - "datason/**"
      - "tests/integration/test_agents_snapshot.py"
      - "tests/fixtures/agents*.json"
      - "scripts/capture_framework_fixtures.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/agents.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Agents resume (${{ matrix.sdk }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        sdk: ["0.22.0", "0.23.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Exercise SDK hooks and owned snapshot resume with an offline model
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run --locked --extra numpy
          --with openai-agents==${{ matrix.sdk }}
          pytest tests/integration/test_agents_snapshot.py
