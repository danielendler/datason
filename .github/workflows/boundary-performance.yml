name: Boundary Performance Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/perf/boundary_study.py"
      - "tests/perf/test_boundary_study.py"
      - "perf/workloads/**"
      - ".github/workflows/boundary-performance.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Check contracts and record a bounded study
        env:
          UV_PYTHON: "3.12"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          uv run --locked --extra numpy --extra pydantic --with orjson==3.12.0 pytest tests/perf/test_boundary_study.py
          uv run --locked --extra numpy --extra pydantic --with orjson==3.12.0 python -m scripts.perf.boundary_study --rounds 3 --iterations 30 --output perf/results/boundary-study.json
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-study
          path: perf/results/boundary-study.json
