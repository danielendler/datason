# =============================================================================
# Datason v2 — Marketing website + documentation on GitHub Pages
# =============================================================================

name: Website and Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "mkdocs.yml", "README.md", "examples/**", "scripts/**", "llms*.txt", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/**", "website/**", "mkdocs.yml", "README.md", "examples/**", "scripts/**", "llms*.txt", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Website and Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked --group docs

      - name: Lint documentation tooling
        run: |
          uv run --locked ruff check scripts/sync_docs.py scripts/docs_hooks.py scripts/check_doc_examples.py scripts/build_site.py scripts/check_site.py examples/langgraph_checkpoint.py
          uv run --locked ruff format --check scripts/sync_docs.py scripts/docs_hooks.py scripts/check_doc_examples.py scripts/build_site.py scripts/check_site.py examples/langgraph_checkpoint.py

      - name: Check generated AI reference
        run: uv run --locked python scripts/sync_docs.py --check

      - name: Run documentation examples
        run: uv run --locked --extra numpy --extra pandas --extra pydantic python scripts/check_doc_examples.py

      - name: Build website and documentation
        run: uv run --locked python scripts/build_site.py

      - name: Check site routes, assets, and live examples
        run: uv run --locked python scripts/check_site.py

      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: documentation
          path: site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
