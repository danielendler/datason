# Use the same documentation dependency group as GitHub Pages.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      - uv sync --locked --group docs
      - uv run --locked python scripts/sync_docs.py --check
    build:
      html:
        - uv run --locked mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
