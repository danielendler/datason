site_name: datason
site_description: "JSON serialization for Python APIs, diagnostics, and typed stored data, with examples and explicit fidelity contracts."
site_url: https://danielendler.github.io/datason/docs/
repo_url: https://github.com/danielendler/datason
repo_name: danielendler/datason
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Recipes: recipes.md
      - Supported types: supported-types.md
      - Troubleshooting: troubleshooting.md
  - Guides:
      - Configuration: configuration.md
      - Structured agent data: agent-data.md
      - Scientific fidelity: scientific-fidelity.md
      - LangGraph checkpoints: langgraph-checkpoints.md
      - Framework compatibility: framework-compatibility.md
      - Tool schema boundary: tool-schema-boundary.md
      - Custom plugins: plugins.md
  - Safety and boundaries:
      - Security: security.md
      - Serialization boundaries: serialization-boundaries.md
      - Built-in reconstruction review: ml-reconstruction-review.md
      - Trusted pickle migration: pickle-migration.md
  - Reference:
      - API: api.md
      - For AI agents: ai-agents.md
      - Migration from v1: migration.md
      - Persisted format contract: persisted-format-contract.md
  - Project:
      - Hardening roadmap: hardening-roadmap.md
      - Adoption evidence: adoption-evidence.md
      - Performance strategy: performance-strategy.md
      - Performance baseline: performance-baseline.md
      - Rust feasibility gate: rust-feasibility.md
      - Release notes: releases/2.0.0a2.md
      - Changelog: changelog.md
      - Contributing: https://github.com/danielendler/datason/blob/main/CONTRIBUTING.md

extra:
  homepage: https://danielendler.github.io/datason/

hooks:
  - scripts/docs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list
  - tables
